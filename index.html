<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha trilha de estudos</title>

  <!-- (Pt) Estilos: um arquivo por responsabilidade / (En) Styles: one file per responsibility -->
  <link rel="stylesheet" href="css/style.css?v=5" />
  <link rel="stylesheet" href="css/header.css?v=5" />
  <link rel="stylesheet" href="css/board.css?v=5" />
  <link rel="stylesheet" href="css/tiles.css?v=5" />
  <link rel="stylesheet" href="css/panel.css?v=5" />
</head>
<body>

  <header class="top-bar">
    <div class="title-block">
      <h1 data-i18n="title">Minha trilha de estudos</h1>
      <p data-i18n="subtitle">Um registro honesto da jornada — não um mapa do que domino</p>
    </div>

    <div class="top-actions">
      <!-- Troca de idioma -->
      <div class="lang-switch" role="group" data-i18n-aria="langLabel" aria-label="Idioma">
        <button type="button" data-lang="pt" aria-pressed="true">PT</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>

      <div class="legend">
        <div class="legend-item atec"><span class="badge"></span> <span data-i18n="cat.atec">formação ATEC</span></div>
        <div class="legend-item estagio"><span class="badge"></span> <span data-i18n="cat.estagio">estágio</span></div>
        <div class="legend-item estudando"><span class="badge"></span> <span data-i18n="cat.estudando">estudando</span></div>
        <div class="legend-item outros"><span class="badge"></span> <span data-i18n="cat.outros">outros</span></div>
      </div>
    </div>
  </header>

  <main class="board-scroll">
    <div class="board-stage">
      <div class="board-container">
        <!-- A pista (SVG), as casas e o painel são montados pelos scripts -->
        <div class="board-track" id="boardTrack">
          <svg class="track-svg" id="trackSvg" aria-hidden="true"></svg>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts: ordem importa (cada um usa o que vem antes) -->
  <script src="js/data.js?v=5"></script>
  <script src="js/i18n.js?v=5"></script>
  <script src="js/layout.js?v=5"></script>
  <script src="js/track.js?v=5"></script>
  <script src="js/tiles.js?v=5"></script>
  <script src="js/panel.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
</body>
</html>
